# The testing ladder's memory tier, in a package of its own because a
# `#[global_allocator]` is per binary: counted inside `ladder/`'s one test
# binary, every other tier's allocations would be the memory tier's too. The
# instrument -- a counting allocator -- and the run it measures are in `src/`,
# their tests in `tests/`, one binary that installs the allocator.
[package]
name = "beggar-memory"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[dependencies]
beggar.workspace = true

[lib]
path = "src/lib.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
