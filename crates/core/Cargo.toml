# The crate, in `core/` as `faction`'s is, beside the `xtask` that gates it.
#
# The metadata shape is faction's, deliberately: same licence, same edition,
# same MSRV, same category set. These two crates are siblings -- protocol-
# independent, driven by a host through one entry point, though faction is a
# state machine and beggar a registry -- and the one place their manifests
# differ is noted below.
[package]
name = "beggar"
version = "0.5.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "A no_std, protocol-independent recovery registry: a recovery is a collection of chunks -- log entries or a snapshot's pieces -- and beggar accounts for which have moved, at both ends of a transfer, to completion or to a cancellation for the caller's own reason; its sessions, what each still lacks, and the finished ones it retains can be queried."
documentation = "https://docs.rs/beggar"
readme = "../../README.md"
keywords = ["recovery", "consensus", "distributed", "registry", "no-std"]
categories = ["no-std", "algorithms", "network-programming"]
autotests = false

# `repository` and `homepage` are the one departure from faction's manifest, and
# not a stylistic one: faction's repository is public, this one is private, so
# both links would resolve to a 404 on the crates.io page. They go in when the
# repository goes public.
#
# `rust-version` was inherited from faction, and measured at 0.1.0: the crate
# builds, and its unit tier passes, on 1.85.0. Measure it again whenever the
# crate reaches for a newer feature of the language or of `alloc`.

[dependencies]

[lib]
name = "beggar"
path = "src/lib.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
