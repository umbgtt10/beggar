# An independent model of beggar's specification, as faction's spec-model is:
# written from the prose and the decision table alone, depending on nothing of
# beggar -- deny.toml refuses it the crate -- and meeting the crate only in the
# specification's encoding, in the ladder. Never published.
[package]
name = "beggar-spec-model"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "An independent model of beggar's specification: its decision table read and interpreted, in the specification's own encoding."
publish = false
autotests = false

[dependencies]
serde_json.workspace = true

[lib]
name = "beggar_spec_model"
path = "src/lib.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
