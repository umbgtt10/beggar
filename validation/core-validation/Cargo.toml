# The testing ladder's cluster simulation tier, as faction's core-validation
# is: a deterministic scenario harness and a cluster simulation over a seeded
# faulty transport, both driving several beggar instances the way a control
# layer would, with the cross-node invariants a recovery must keep. The
# harness is its `src/`; its tests, named for what they prove, its `tests/`.
[package]
name = "beggar-core-validation"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[dependencies]
beggar.workspace = true

[dev-dependencies]
proptest.workspace = true

[lib]
name = "beggar_core_validation"
path = "src/lib.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
