# What cargo-mutants mutates here, for a hand run and for sentinel4rust alike:
# beggar, the no_std recovery registry in crates/core, against its own tests
# only. The specification's model, the validation harnesses and xtask (the
# gates) are not mutated. From the workspace root every package is selected
# and this glob keeps the core's files; the baseline then tests only the
# mutated package, and each mutant runs that package's tests, which
# test_workspace says outright.
examine_globs = ["crates/core/src/**/*.rs"]
test_workspace = false

# Mutants no test can catch, each with why.
#
# Registry::open finds a new session's place among the open ones, ordered by
# name, as the first whose name is not below it. `<=` would put it after an
# open session of the same name instead -- but there never is one: an adopted
# name already open is answered before open is called (OpeningRows::adoption),
# and a started session's name is minted fresh, its count past every name
# this instance has given -- after a restore too, a checkpoint no
# ShowRegistry answered being outside the specification (SPEC.md, section 2).
# Unique names make both places the same.
exclude_re = ["replace < with <= in Registry::open"]
