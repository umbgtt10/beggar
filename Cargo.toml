# A virtual workspace rather than a package at the root: the crates under
# `crates/`, what checks them under `validation/`, and `xtask/` running the gates.
#
# The split is not cosmetic, and etheram-core paid for learning it: while a crate
# sits at the repository root its package directory *is* the repository root, so
# `cargo stern4rust` walks `validation/**` and `xtask/**` and reports their code
# as living in the crate's source tree. `--package` does not narrow it, because
# the scope is the directory.
[workspace]
members = [
    "crates/core",
    "crates/spec-model",
    "validation/core-validation",
    "validation/ladder",
    "validation/memory",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

# What validates a change, for cargo-ripe4rust (`just ripe`): the commands it
# runs, in this order, to judge an upgrade ripe rather than asked about.
[workspace.metadata.ripe4rust]
gates = ["just stage1", "just stage2"]

[workspace.dependencies]
beggar = { path = "crates/core" }
beggar-core-validation = { path = "validation/core-validation" }
beggar-spec-model = { path = "crates/spec-model" }
boon = "0.6"
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# The gates, taken by xtask from serge4rust, the house's quality gates as a
# library, from crates.io.
serge4rust = "0.2"
sha2 = "0.11.2"
