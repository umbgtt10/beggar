# A virtual workspace rather than a package at the root: `core/` is the crate and
# `xtask/` runs the gates.
#
# The split is not cosmetic, and etheram-core paid for learning it: while a crate
# sits at the repository root its package directory *is* the repository root, so
# `cargo stern4rust` walks `xtask/tests/**` and reports its test functions as
# living in the crate's source tree. `--package` does not narrow it, because the
# scope is the directory.
[workspace]
members = ["core", "core-validation", "ladder", "memory", "xtask"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
beggar = { path = "core" }
beggar-core-validation = { path = "core-validation" }
boon = "0.6"
proptest = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
